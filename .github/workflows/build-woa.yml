name: Build Joplin for Windows ARM64

on:
  push:
    tags:
      - 'v*' # Triggers on release tags (e.g., v1.0.0, v3.1.2)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write # Needed to create GitHub Releases and upload assets

jobs:
  build-arm64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Build Desktop App
        run: |
          cd packages/app-desktop
          yarn run build

      - name: Package Desktop App for WOA
        run: |
          cd packages/app-desktop
          yarn run dist --win --arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Save artifact for manual test runs
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-win-arm64
          path: packages/app-desktop/dist/*.exe

      # Publish directly to GitHub Releases page on tag push
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create ${{ github.ref_name }} packages/app-desktop/dist/*.exe --title "Joplin WOA ${{ github.ref_name }}" --notes "Automated Windows on ARM (ARM64) build for Joplin."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
