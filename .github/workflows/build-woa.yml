name: Build Joplin for Windows ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      # Add C++ build environment tools available on windows-latest
      - name: Setup MSVC C++ Build Tools
        uses: llvm/actions/install-ninja@v1

      # 1. Install JS dependencies without firing node-gyp on keytar immediately
      - name: Install dependencies
        run: yarn install --ignore-scripts

      # 2. Build Joplin core/desktop scripts
      - name: Build Desktop App
        run: |
          cd packages/app-desktop
          yarn run build

      # 3. Package app for Windows ARM64 (Electron Builder compiles native modules for ARM64 here)
      - name: Package Desktop App for WOA
        run: |
          cd packages/app-desktop
          yarn run dist --win --arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: arm64

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-win-arm64
          path: packages/app-desktop/dist/*.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create ${{ github.ref_name }} packages/app-desktop/dist/*.exe --title "Joplin WOA ${{ github.ref_name }}" --notes "Automated Windows on ARM (ARM64) build for Joplin."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
