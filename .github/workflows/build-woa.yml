name: Build Joplin for Windows ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    # Use native ARM64 Windows host — no cross-compilation required
    runs-on: windows-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      # Standard Yarn install works cleanly on native ARM64 runner
      - name: Install dependencies
        run: yarn install

      - name: Build Desktop App
        run: |
          cd packages/app-desktop
          yarn run build

      - name: Package Desktop App
        run: |
          cd packages/app-desktop
          yarn run dist --win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-win-arm64
          path: packages/app-desktop/dist/*.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create ${{ github.ref_name }} packages/app-desktop/dist/*.exe --title "Joplin WOA ${{ github.ref_name }}" --notes "Automated Windows on ARM (ARM64) build for Joplin."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
